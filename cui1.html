    <script>
        function initCityCarousel() {
            const carousel = document.querySelector('.city-carousel');
            const prevBtn = document.querySelector('.carousel-prev');
            const nextBtn = document.querySelector('.carousel-next');
            const indicatorsContainer = document.querySelector('.carousel-indicators');
            const cityGroups = document.querySelectorAll('.city-group');
            const regionBtns = document.querySelectorAll('.region-btn');
            const cityCarouselContainer = document.querySelector('.city-carousel-container');
        
            
            let currentIndex = 0;
            const groupWidth = 100;
            let autoSlideInterval;
            
            // 创建指示器
            indicatorsContainer.innerHTML = '';
            cityGroups.forEach((_, index) => {
                const indicator = document.createElement('div');
                indicator.classList.add('indicator');
                if (index === 0) indicator.classList.add('active');
                indicator.addEventListener('click', () => goToSlide(index));
                indicatorsContainer.appendChild(indicator);
            });
            
            const indicators = document.querySelectorAll('.indicator');
            
            // 导航按钮事件
            prevBtn.addEventListener('click', () => {
                currentIndex = currentIndex > 0 ? currentIndex - 1 : cityGroups.length - 1;
                updateCarousel();
            });
            
            nextBtn.addEventListener('click', () => {
                currentIndex = currentIndex < cityGroups.length - 1 ? currentIndex + 1 : 0;
                updateCarousel();
            });
            
            // 区域筛选
            regionBtns.forEach(btn => {
                btn.addEventListener('click', function() {
                    regionBtns.forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    
                    const region = this.dataset.region;
                    const targetIndex = Array.from(cityGroups).findIndex(
                        group => group.dataset.region === region
                    );
                    
                    if (targetIndex !== -1) {
                        goToSlide(targetIndex);
                    }
                });
            });
            
            // 自动轮播控制
            function startAutoSlide() {
                autoSlideInterval = setInterval(() => {
                    currentIndex = currentIndex < cityGroups.length - 1 ? currentIndex + 1 : 0;
                    updateCarousel();
                }, 5000);
            }
            
            function stopAutoSlide() {
                clearInterval(autoSlideInterval);
            }
            
            // 轮播图切换
            function goToSlide(index) {
                currentIndex = index;
                updateCarousel();
            }
            
            function updateCarousel() {
                carousel.style.transform = `translateX(-${currentIndex * groupWidth}%)`;
                
                // 更新指示器状态
                indicators.forEach((indicator, idx) => {
                    indicator.classList.toggle('active', idx === currentIndex);
                });
                
                // 更新区域按钮激活状态
                const currentRegion = cityGroups[currentIndex].dataset.region;
                regionBtns.forEach(btn => {
                    btn.classList.toggle('active', btn.dataset.region === currentRegion);
                });
                
                // 更新轮播标题
                const currentTitle = cityGroups[currentIndex].querySelector('.group-title').textContent;
                // document.getElementById('carousel-title').textContent = currentTitle;
            }
            
            // 自动轮播控制
            carousel.addEventListener('mouseenter', stopAutoSlide);
            carousel.addEventListener('mouseleave', startAutoSlide);
            
            // 初始化
            updateCarousel();
            startAutoSlide();
        }

        // 在现有的DOMContentLoaded事件监听器中添加此函数调用
        document.addEventListener('DOMContentLoaded', function() {
            initCityCarousel();
            // 其他初始化代码保持不变...
        });
                
        // 返回顶部功能
        function initScrollTop() {
            const scrollTopBtn = document.getElementById('scroll-top');
            
            window.addEventListener('scroll', () => {
                if (window.scrollY > 300) {
                    scrollTopBtn.style.display = 'flex';
                } else {
                    scrollTopBtn.style.display = 'none';
                }
            });
            
            scrollTopBtn.addEventListener('click', () => {
                window.scrollTo({
                    top: 0,
                    behavior: 'smooth'
                });
            });
        }
        
        // 初始化函数
        document.addEventListener('DOMContentLoaded', function() {
            initCityCarousel();
            initScrollTop();
            
            // 导航激活状态
            const navLinks = document.querySelectorAll('.navbar a');
            navLinks.forEach(link => {
                link.addEventListener('click', function() {
                    navLinks.forEach(item => item.classList.remove('active'));
                    this.classList.add('active');
                });
            });
            
            // 移动端菜单切换
            document.getElementById('menu-btn').addEventListener('click', function() {
                document.querySelector('.navbar').classList.toggle('active');
            });
            
            // 天气按钮功能
            document.querySelectorAll('.weather-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    const cityName = event.target.getAttribute('data-city');
                    const weatherInfoElement = event.target.nextElementSibling;
                    
                    // 显示加载状态
                    weatherInfoElement.textContent = '获取天气中...'

                    getWeather(cityName, weatherInfoElement);
                })
            })
        })

    </script>
