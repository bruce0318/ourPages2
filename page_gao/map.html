<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <title>天地图+点数据增删查改</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@v7.3.0/ol.css">
  <style>
    #map {
      width: 100%;
      height: 600px;
    }

    .toolbar {
      margin: 10px;
    }

    #city-select {
    color: black; /* 设置为黑色字体 */
    background-color: rgb(255, 255, 255); /* 可选：显式设置背景色 */
  }
  </style>
</head>

<body>

  <!-- 工具条 -->
  <div class="toolbar">
    <button id="draw-point">添加</button>
    <select id="city-select" style="display:none;width: 150px;">
      <!-- 城市选项将通过 JavaScript 动态填充 -->
    </select>
    <button id="delete-feature">删除</button>
    <button id="select-feature">修改</button>
    <button id="search-feature">查找</button>
  </div>

  <!-- 地图容器 -->
  <div id="map"></div>

  <!-- 加载 OpenLayers -->
  <script src="https://cdn.jsdelivr.net/npm/ol@v7.3.0/dist/ol.js"></script>
  <script>
    // =================== 初始化地图 ===================
    const tianDiMapLayer = new ol.layer.Tile({
      source: new ol.source.XYZ({
        url: 'http://t0.tianditu.gov.cn/vec_w/wmts?tk=69f309a12fd1846d772c35a6d250e1d6&' +
          'SERVICE=WMTS&REQUEST=GetTile&VERSION=1.0.0&' +
          'LAYER=vec&STYLE=default&TILEMATRIXSET=w&' +
          'FORMAT=tiles&TILEMATRIX={z}&TILEROW={y}&TILECOL={x}',
        attributions: '天地图底图数据'
      })
    });

    // 矢量点图层（WFS）
    const vectorSource = new ol.source.Vector({
      format: new ol.format.GeoJSON(),
      url: function (extent) {
        return (
          'http://47.110.54.187:8888/geoserver/wfs?service=WFS&' +
          'version=2.0.0&request=GetFeature&typeNames=gao:gao&' +
          'outputFormat=application/json&srsname=EPSG:4326'
        );
      },
      strategy: ol.loadingstrategy.bbox
    });

    const vectorLayer = new ol.layer.Vector({
      source: vectorSource,
      updateWhileInteracting: true,
      style: new ol.style.Style({
        image: new ol.style.Icon({
          src: 'http://47.110.54.187:8888/geoserver/www/icon/footprint.svg',
          scale: 0.5,
          crossOrigin: 'anonymous'
        })
      })
    });

    // 面图层（WMS）
    const wmsPolygonLayer = new ol.layer.Tile({
      source: new ol.source.TileWMS({
        url: 'http://47.110.54.187:8888/geoserver/wms',
        params: {
          LAYERS: 'gao:province',
          TILED: true,
          VERSION: '1.3.0'
        },
        serverType: 'geoserver',
        crossOrigin: 'anonymous'
      }),
      visible: true,
      opacity: 0.6
    });

    // 创建地图
    const map = new ol.Map({
      target: 'map',
      layers: [tianDiMapLayer, wmsPolygonLayer, vectorLayer],
      view: new ol.View({
        center: [114.306124, 30.572352],
        zoom: 5,
        projection: 'EPSG:4326'
      })
    });

    // =================== 工具条功能实现 ===================

    let draw, select, modify;

    function clearInteractions() {
      map.getInteractions().forEach(interaction => {
        if (interaction instanceof ol.interaction.Draw ||
          interaction instanceof ol.interaction.Select) {
          map.removeInteraction(interaction);
        }
      });
    }

    document.getElementById('draw-point').addEventListener('click', () => {
      clearInteractions();

      // 显示下拉框
      const citySelect = document.getElementById('city-select');
      citySelect.style.display = 'inline-block';

      // 清空已有选项
      citySelect.innerHTML = '';

      // 请求 gao:city 数据
      const cityUrl = 'http://47.110.54.187:8888/geoserver/wfs?service=WFS&' +
        'version=2.0.0&request=GetFeature&typeNames=gao:city&' +
        'outputFormat=application/json&srsname=EPSG:4326';

      fetch(cityUrl)
        .then(res => res.json())
        .then(data => {
          const features = new ol.format.GeoJSON().readFeatures(data);
          features.forEach(feature => {
            const option = document.createElement('option');
            option.value = JSON.stringify({
              city: feature.get('city'),
              province: feature.get('province'), // 自动获取 Province
              geometry: feature.getGeometry().getCoordinates()
            });
            option.textContent = feature.get('city'); // 显示 City
            citySelect.appendChild(option);
          });
        });

      // 监听下拉框变化
      citySelect.onchange = () => {
        const selected = JSON.parse(citySelect.value);
        const [lon, lat] = selected.geometry;

        // 弹窗只获取 Name 和 Time
        const name = prompt('请输入 Name:');
        const time = prompt('请输入 Time:');

        if (!name || !time) return;

        // 获取当前矢量图层数量生成新 ID
        const id = vectorSource.getFeatures().length + 1;

        // 创建新 Feature
        const newFeature = new ol.Feature(new ol.geom.Point([lon, lat]));
        newFeature.setId('gao.gao.' + id);
        newFeature.setProperties({
          id: id,
          name: name,
          province: selected.province, // 自动填充 Province
          city: selected.city,         // 自动填充 City
          time: time
        });

        // 添加到矢量源
        vectorSource.addFeature(newFeature);

        // 保存到 Geoserver
        saveFeatureToGeoserver(newFeature);
      };
    });

    function saveFeatureToGeoserver(feature) {
      const format = new ol.format.GeoJSON();
      const geojson = format.writeFeatureObject(feature);

      fetch('http://47.110.54.187:8888/geoserver/wfs', {
        method: 'POST',
        body: `
      <wfs:Transaction service="WFS" version="2.0.0"
        xmlns:wfs="http://www.opengis.net/wfs/2.0"
        xmlns:gao="http://www.example.com/gao">
        <wfs:Insert>
          ${format.writeFeature(geojson)}
        </wfs:Insert>
      </wfs:Transaction>
    `,
        headers: {
          'Content-Type': 'text/xml'
        }
      }).then(response => {
        console.log('新增成功');
        feature.setProperties({ saved: true });
      }).catch(err => {
        console.error('新增失败:', err);
      });
    }

    // --- 删除点 ---
    document.getElementById('delete-feature').addEventListener('click', () => {
      clearInteractions();
      select = new ol.interaction.Select({
        condition: ol.events.condition.click
      });
      map.addInteraction(select);

      select.on('select', e => {
        const selected = e.selected;
        if (selected.length > 0) {
          const feature = selected[0];
          deleteFeatureFromGeoserver(feature);
          vectorSource.removeFeature(feature);
        }
      });
    });

    function deleteFeatureFromGeoserver(feature) {
      const fid = feature.getId(); // 假设图层有 FID 字段
      fetch('http://47.110.54.187:8888/geoserver/wfs', {
        method: 'POST',
        body: `
        <wfs:Transaction service="WFS" version="2.0.0"
          xmlns:wfs="http://www.opengis.net/wfs/2.0"
          xmlns:gao="http://www.example.com/gao">
          <wfs:Delete typeName="gao:gao">
            <ogc:Filter>
              <ogc:PropertyIsEqualTo>
                <ogc:PropertyName>id</ogc:PropertyName>
                <ogc:Literal>${fid}</ogc:Literal>
              </ogc:PropertyIsEqualTo>
            </ogc:Filter>
          </wfs:Delete>
        </wfs:Transaction>
      `,
        headers: {
          'Content-Type': 'text/xml'
        }
      }).then(response => {
        console.log('删除成功');
      }).catch(err => {
        console.error('删除失败:', err);
      });
    }

    // --- 修改点 ---
    document.getElementById('select-feature').addEventListener('click', () => {
      clearInteractions();
      select = new ol.interaction.Select({
        condition: ol.events.condition.click
      });
      map.addInteraction(select);

      modify = new ol.interaction.Modify({ source: vectorSource });
      map.addInteraction(modify);

      modify.on('modifyend', e => {
        const features = e.features.getArray();
        features.forEach(f => updateFeatureOnGeoserver(f));
      });
    });

    function updateFeatureOnGeoserver(feature) {
      const format = new ol.format.GeoJSON();
      const geojson = format.writeFeatureObject(feature);

      fetch('http://47.110.54.187:8888/geoserver/wfs', {
        method: 'POST',
        body: `
        <wfs:Transaction service="WFS" version="2.0.0"
          xmlns:wfs="http://www.opengis.net/wfs/2.0"
          xmlns:gao="http://www.example.com/gao">
          <wfs:Update typeName="gao:gao">
            ${format.writeFeature(geojson)}
          </wfs:Update>
        </wfs:Transaction>
      `,
        headers: {
          'Content-Type': 'text/xml'
        }
      }).then(response => {
        console.log('更新成功');
      }).catch(err => {
        console.error('更新失败:', err);
      });
    }

    // --- 查找点 ---
    document.getElementById('search-feature').addEventListener('click', () => {
      const keyword = prompt('请输入要查找的城市名称（如 name）:');
      if (!keyword) return;

      const url = 'http://47.110.54.187:8888/geoserver/wfs?service=WFS&' +
        'version=2.0.0&request=GetFeature&typeNames=gao:gao&' +
        'outputFormat=application/json&srsname=EPSG:4326&' +
        `CQL_FILTER=City='${keyword}'`;

      fetch(url).then(res => res.json()).then(data => {
        const features = new ol.format.GeoJSON().readFeatures(data);
        if (features.length === 0) {
          alert('未找到相关数据');
          return;
        }

        vectorSource.clear();
        vectorSource.addFeatures(features);
        map.getView().fit(vectorSource.getExtent(), { padding: [100, 100, 100, 100] });
      }).catch(err => {
        console.error('查询失败:', err);
      });
    });

  </script>
</body>

</html>
